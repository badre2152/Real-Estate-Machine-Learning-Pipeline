
services:

  - type: web
    name: avito-ml-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: "uvicorn src.api:app --host 0.0.0.0 --port $PORT --workers 1"
    plan: free

    healthCheckPath: /ready

    envVars:
      - key: API_KEYS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: CORS_ORIGINS
        sync: false

      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      - key: MODELS_DIR
        value: /app/models
      - key: PYTHONPATH
        value: /app/src
      - key: LOG_LEVEL
        value: INFO

