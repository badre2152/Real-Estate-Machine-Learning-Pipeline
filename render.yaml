# 
# render.yaml: Render Blueprint configuration
#
# كيفاش تستعمله:
#   1. سجل في https://render.com (مجاني)
#   2. New to Blueprint to ربط الـ GitHub repo
#   3. Render يقرأ هذا الملف ويعمل deploy تلقائي
#
# Variables اللي تحتاج تغيّرها في Dashboard:
#   - API_KEYS          to كلمة السر ديال الـ API
#   - DB_PASSWORD       to كلمة السر ديال قاعدة البيانات
# 

services:

  # API FastAPI
  - type: web
    name: avito-ml-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: "uvicorn src.api:app --host 0.0.0.0 --port $PORT --workers 1"
    # تغيّر إلى "standard" (7$/شهر) للـ production
    plan: free

    healthCheckPath: /health

    envVars:
      # Security: غيّر هذا في Render Dashboard
      - key: API_KEYS
        sync: false          # Render يطلب منك تكتبها يدوياً (أمان)
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: CORS_ORIGINS
        sync: false

      # Database: من الـ PostgreSQL service أسفله
      - key: DB_HOST
        fromService:
          name: avito-ml-db
          type: pserv
          property: host
      - key: DB_PORT
        fromService:
          name: avito-ml-db
          type: pserv
          property: port
      - key: DB_NAME
        value: real_estate_db
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        fromService:
          name: avito-ml-db
          type: pserv
          property: connectionString

      # App
      - key: MODELS_DIR
        value: /app/models
      - key: PYTHONPATH
        value: /app/src
      - key: LOG_LEVEL
        value: INFO

  # PostgreSQL
  - type: pserv
    name: avito-ml-db
    runtime: docker
    image: postgres:15-alpine
    plan: free
    envVars:
      - key: POSTGRES_DB
        value: real_estate_db
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true     # Render يولّد password عشوائي تلقائياً
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 1
