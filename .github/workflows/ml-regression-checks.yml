name: ML regression checks

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/ml-regression-checks.yml"
  push:
    branches:
      - master

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas scipy scikit-learn PyYAML python-dotenv
      - name: Compile regression modules
        run: python -m compileall -q src/prepare.py src/regression.py src/pipeline.py
      - name: Run focused regression tests
        run: |
          python -m pytest -q tests/test_prepare_classification_labels.py tests/test_regression_cv_preprocessing.py tests/test_regression_optimization_cv.py tests/test_regression_cv_smoke.py
