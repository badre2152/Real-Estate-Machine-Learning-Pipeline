# Continuous integration runs automatically on master pushes and pull requests.
# Publishing to Docker Hub and deploying to Render are manual because they
# require repository secrets that are not part of the codebase.

name: ML Pipeline CI with optional CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_cd:
        description: "Publish the Docker image and trigger the Render deployment"
        required: true
        default: false
        type: boolean

jobs:
  test:
    name: Tests and Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: real_estate_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: real_estate_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          API_KEYS: test-key-ci
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=75 \
            -x

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff==0.16.10

      - name: Run critical Ruff checks
        run: ruff check src/ tests/ --select E9,F63,F7,F82

      - name: Run full Ruff audit
        continue-on-error: true
        run: ruff check src/ tests/ --ignore E501,E402

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - name: Build API image locally
        run: docker build --target api -t avito-ml-api:ci .

      - name: Verify image imports
        run: |
          docker run --rm avito-ml-api:ci python -c "
          import fastapi, mlflow, pandas, sklearn
          print('Docker image imports OK')
          "

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'workflow_dispatch' && inputs.run_cd

    env:
      DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/avito-ml-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'workflow_dispatch' && inputs.run_cd
    environment: production

    steps:
      - name: Trigger Render deploy
        run: |
          curl --fail --silent --show-error -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

      - name: Wait before smoke tests
        run: sleep 30

      - name: Smoke test health endpoint
        env:
          SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          test -n "$SERVICE_URL"
          curl --fail --silent --show-error "$SERVICE_URL/health" > /dev/null

      - name: Smoke test authentication
        env:
          SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          test -n "$SERVICE_URL"
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" "$SERVICE_URL/v1/info")
          test "$HTTP_STATUS" = "401"
