# 
# dvc.yaml: Pipeline DVC pour le versioning des données et modèles
#
# Chaque stage définit :
#   cmd      : commande à exécuter
#   deps     : fichiers/dossiers qui déclenchent un re-run si modifiés
#   params   : paramètres lus dans config.yaml qui déclenchent un re-run
#   outs     : sorties cachées et versionnées par DVC
#   metrics  : fichiers de métriques trackés par DVC
#   plots    : fichiers de plots trackés par DVC
#
# Lancer le pipeline complet :
#   dvc repro
#
# Lancer un stage spécifique :
#   dvc repro extract
#
# Comparer deux versions :
#   dvc metrics diff HEAD~1
# 

stages:

  # Stage 1 : Extraction
  extract:
    cmd: python src/extract.py --output data/raw/obt.parquet
    deps:
      - src/extract.py
    params:
      - config/config.yaml:
          - database.table
          - database.host
          - database.port
    outs:
      - data/raw/obt.parquet:
          cache: true
          persist: false

  # Stage 2 : Validation
  validate:
    cmd: python -c "
      import pandas as pd
      from src.data_validation import DataValidator
      df = pd.read_parquet('data/raw/obt.parquet')
      v = DataValidator()
      r = v.validate(df, stage='dvc_validate')
      v.save_report(r, output_dir='reports')
      import sys; sys.exit(0 if r.passed else 1)
      "
    deps:
      - data/raw/obt.parquet
      - src/data_validation.py
    params:
      - config/config.yaml:
          - validation.required_columns
          - validation.price_min
          - validation.price_max
          - validation.max_missing_pct
    outs:
      - reports/validation_report.json:
          cache: false

  # Stage 3 : Feature Engineering
  featurize:
    cmd: python -c "
      import pandas as pd, pickle
      from sklearn.model_selection import train_test_split
      from src.prepare import clean_dataframe
      from src.features import engineer_features_train, engineer_features_test, add_classification_target
      df = pd.read_parquet('data/raw/obt.parquet')
      df = clean_dataframe(df)
      df_train, df_test = train_test_split(df, test_size=0.2, random_state=42)
      df_train, geo_stats = engineer_features_train(df_train)
      df_test = engineer_features_test(df_test, geo_stats)
      df_test = add_classification_target(df_test)
      df_train.to_parquet('data/processed/train_fe.parquet', index=False)
      df_test.to_parquet('data/processed/test_fe.parquet', index=False)
      with open('data/processed/geo_stats.pkl','wb') as f: pickle.dump(geo_stats, f)
      print(f'Train : {len(df_train):,} | Test : {len(df_test):,}')
      "
    deps:
      - data/raw/obt.parquet
      - src/features.py
      - src/prepare.py
    params:
      - config/config.yaml:
          - pipeline.test_size
          - pipeline.random_state
    outs:
      - data/processed/train_fe.parquet:
          cache: true
      - data/processed/test_fe.parquet:
          cache: true
      - data/processed/geo_stats.pkl:
          cache: true

  # Stage 4 : Entraînement complet
  train:
    cmd: python src/pipeline.py
    deps:
      - src/pipeline.py
      - src/regression.py
      - src/classification.py
      - src/baselines.py
      - src/smote_handler.py
      - src/prediction_intervals.py
      - src/shap_explainer.py
      - src/report_generator.py
      - data/raw/obt.parquet
    params:
      - config/config.yaml:
          - pipeline.optimize
          - pipeline.use_log_target
          - pipeline.use_smote
          - pipeline.use_calibration
          - pipeline.test_size
          - pipeline.random_state
          - regression.cv_folds
          - regression.n_iter_search
          - classification.cv_folds
          - smote.k_neighbors
          - prediction_intervals.method
          - prediction_intervals.confidence_level
    outs:
      - models/best_regression_model.pkl:
          cache: true
      - models/best_classification_model.pkl:
          cache: true
      - models/preprocessor.pkl:
          cache: true
      - models/pi_builder.pkl:
          cache: true
      - models/feature_names.pkl:
          cache: true
      - models/label_encoder.pkl:
          cache: true
    metrics:
      - models/results.json:
          cache: false
    plots:
      - docs/plots:
          cache: false

  # Stage 5 : Évaluation & Rapport
  evaluate:
    cmd: python -c "
      import json
      with open('models/results.json') as f:
          r = json.load(f)
      reg = r.get('regression', {})
      clf = r.get('classification') or {}
      print(f'R2={reg.get(\"R2\",0):.4f} | MAE={reg.get(\"MAE\",0):,.0f}')
      if clf:
          print(f'F1={clf.get(\"F1\",0):.4f} | Acc={clf.get(\"Accuracy\",0):.4f}')
      "
    deps:
      - models/results.json
    metrics:
      - models/results.json:
          cache: false
