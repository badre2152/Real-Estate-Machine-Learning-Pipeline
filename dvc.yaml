
stages:

  extract:
    cmd: python src/extract.py --output data/raw/obt.parquet
    deps:
      - src/extract.py
      - src/config_loader.py
    params:
      - config/config.yaml:
          - database.table
          - database.host
          - database.port
    outs:
      - data/raw/obt.parquet:
          cache: true
          persist: false

  validate:
    cmd: python src/validate_dvc.py --input data/raw/obt.parquet --output-dir reports/dvc
    deps:
      - data/raw/obt.parquet
      - src/data_validation.py
      - src/validate_dvc.py
      - src/config_loader.py
    params:
      - config/config.yaml:
          - validation.required_columns
          - validation.price_min
          - validation.price_max
          - validation.surface_min
          - validation.surface_max
          - validation.max_missing_pct
    outs:
      - reports/dvc/validation_report.json:
          cache: false

  featurize:
    cmd: python src/featurize_dvc.py
    deps:
      - data/raw/obt.parquet
      - src/featurize_dvc.py
      - src/features.py
      - src/prepare.py
      - src/config_loader.py
    params:
      - config/config.yaml:
          - pipeline.test_size
          - pipeline.random_state
          - prediction_intervals.method
    outs:
      - data/processed/train_fe.parquet:
          cache: true
      - data/processed/test_fe.parquet:
          cache: true
      - data/processed/geo_stats.pkl:
          cache: true
      - data/processed/calibration_fe.parquet:
          cache: true

  train:
    cmd: python src/pipeline.py --input-parquet data/raw/obt.parquet --train-features data/processed/train_fe.parquet --test-features data/processed/test_fe.parquet --calibration-features data/processed/calibration_fe.parquet
    deps:
      - src/pipeline.py
      - src/regression.py
      - src/classification.py
      - src/baselines.py
      - src/smote_handler.py
      - src/prediction_intervals.py
      - src/shap_explainer.py
      - src/report_generator.py
      - src/config_loader.py
      - data/raw/obt.parquet
      - data/processed/train_fe.parquet
      - data/processed/test_fe.parquet
      - data/processed/calibration_fe.parquet
      - reports/dvc/validation_report.json
    params:
      - config/config.yaml:
          - pipeline.optimize
          - pipeline.use_log_target
          - pipeline.use_smote
          - pipeline.use_calibration
          - pipeline.generate_plots
          - pipeline.test_size
          - pipeline.random_state
          - regression.cv_folds
          - regression.n_iter_search
          - classification.cv_folds
          - smote.k_neighbors
          - prediction_intervals.method
          - prediction_intervals.confidence_level
    outs:
      - models/best_regression_model.pkl:
          cache: true
      - models/preprocessor.pkl:
          cache: true
      - models/feature_names.pkl:
          cache: true
    metrics:
      - models/results.json:
          cache: false

  evaluate:
    cmd: python src/evaluate_dvc.py
    deps:
      - models/results.json
      - src/evaluate_dvc.py
